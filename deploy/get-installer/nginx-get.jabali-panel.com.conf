# get.jabali-panel.com — short installer URL (GH #444).
# Redirects to the canonical raw install.sh; `curl -fsSL ... | bash` follows
# the 302 (-L is implied by -fsSL). Swap the target to a channel-aware
# bootstrapper later if/when release channels land (GH #445).
server {
    listen 80;
    listen [::]:80;
    server_name get.jabali-panel.com;
    # ACME http-01 for the TLS cert below.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name get.jabali-panel.com;
    ssl_certificate     /etc/letsencrypt/live/get.jabali-panel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/get.jabali-panel.com/privkey.pem;
    location / { return 302 https://raw.githubusercontent.com/shukiv/jabali-panel/main/install.sh; }
}
