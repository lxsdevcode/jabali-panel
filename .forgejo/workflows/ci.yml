# Forgejo Actions CI — gate every PR against the test suite so the kind of
# silent baseline rot that slipped past M20 cutover can't recur.
#
# Jobs (all run unconditionally): Go tests+vet, install.sh lint, vitest,
# Playwright E2E. Runs on the self-hosted `jabali-ci` runner (host-exec,
# dedicated 3-CPU/14-GiB box).
#
# HISTORY: a `changes` path-filter gate job used to skip untouched trees to
# save wall-clock on the old single 2-CPU mx runner. On Codeberg's runner the
# gate job failed intermittently in actions/checkout teardown (unreachable
# logs) and the optimization wasn't worth the fragility on a capable box —
# removed 2026-07-06. All four jobs now run every PR. nightly.yml still runs
# the same suite on a schedule.

name: CI

on:
  pull_request:
    branches: [main]
  # Allow manual re-run from the Actions UI if needed for audit.
  workflow_dispatch:

# Concurrency group per ref keeps PR pushes from piling up stale in-flight
# jobs on the runner (push a new version, the old run auto-cancels). BUT
# on `main`, each commit is a permanent state we want an authoritative
# green/red record for — auto-cancelling means rapid-fire direct-pushes
# to main never complete CI. Gate cancel-in-progress to non-main refs so
# main runs always run to completion (they queue if pushes outrun runner
# throughput) and PR runs still auto-supersede.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep the Go + Node toolchains pinned so local `make test-all` and CI
  # run the same versions. Bump here to upgrade fleet-wide.
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go tests + vet
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false — the runner's persistent volume-mounted $GOMODCACHE
          # already gives the caching benefit; setup-go's tar layer conflicts
          # with a pre-existing cache ("File exists").
          cache: false
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test

  install-sh-lint:
    # Phantom-function detector for install.sh — guards against the
    # install_snuffleupagus / verify_socket_perms regression class where a
    # function gets removed from install.sh during a refactor but the call
    # site stays. Live-host "command not found" mid-deploy was the symptom.
    name: install.sh phantom-function lint
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: tools/lint-install-sh.sh

  ui-unit:
    name: panel-ui unit tests (vitest)
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install deps
        run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      # ESLint (flat config): typescript-eslint + react-hooks. Fails on errors;
      # warnings advisory (npm run lint drops --max-warnings 0).
      - name: eslint
        run: cd panel-ui && npm run lint
      - name: vitest
        run: cd panel-ui && npm test

  e2e:
    name: Playwright E2E
    runs-on: jabali-ci
    # Serialize e2e across ALL refs — port 4173 is a host-level resource, so a
    # PR run and a main run must queue, not race to bind it (EADDRINUSE).
    concurrency:
      group: e2e-port-4173
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - name: Install deps
        run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      # `install chromium` (NOT --with-deps): the image bakes the OS libs and
      # the browser caches in the persistent ~/.cache/ms-playwright volume, so
      # this is a near-instant version check.
      - name: Install Playwright Chromium
        run: cd panel-ui && npx playwright install chromium
      - name: Build SPA
        run: cd panel-ui && npm run build
      # A stuck vite-preview from a previous run can hold 4173. Kill any prior
      # one and verify the port is free (procps/iproute2 are in the image).
      - name: Free port 4173
        run: |
          pgrep -a -f "vite preview" || echo "(none)"
          pkill -9 -f "vite preview" 2>/dev/null || true
          for i in $(seq 1 10); do
            ss -tln | grep -q ":4173 " || break
            sleep 1
          done
          if ss -tln | grep -q ":4173 "; then
            echo "ERROR: port 4173 still in use after kill + 10s wait"
            exit 1
          fi
      # --workers from playwright.config.ts (CI => 2); one webServer, per-test
      # API mocking so no shared backend state between workers.
      - name: Playwright
        run: cd panel-ui && npx playwright test --project=chromium --reporter=list
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            panel-ui/test-results/
            panel-ui/playwright-report/
          retention-days: 7
