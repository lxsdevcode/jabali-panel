# Nightly full-suite run — the safety net for ci.yml's path-filtered PR gate.
#
# ci.yml skips a job's expensive steps when the PR didn't touch that tree
# (Go-only PR skips E2E, panel-ui-only PR skips the Go race suite, etc.).
# That is safe for the common case but can, in principle, miss a
# cross-cutting change the path filter didn't attribute correctly. This
# workflow runs EVERYTHING unconditionally once a day so any such gap is
# caught within 24h rather than at deploy time.
#
# Also does the slow/advisory checks we deliberately keep OFF the PR path:
# `npm audit` (dependency vulnerabilities — advisory, non-blocking).
#
# Trigger: schedule (03:00 UTC) + manual (workflow_dispatch). If the Gitea
# instance has scheduled Actions disabled, the manual trigger still works.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go tests + vet (race)
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: make vet
      - run: make test

  ui-unit:
    name: panel-ui unit tests (vitest)
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - run: cd panel-ui && npm run lint
      - run: cd panel-ui && npm test

  e2e:
    name: Playwright E2E (full)
    runs-on: jabali-ci
    concurrency:
      group: e2e-port-4173
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json
      - run: cd panel-ui && npm ci --no-audit --no-fund --prefer-offline
      - run: cd panel-ui && npx playwright install chromium
      - run: cd panel-ui && npm run build
      - name: Free port 4173
        run: |
          pkill -9 -f "vite preview" 2>/dev/null || true
          for i in $(seq 1 10); do
            ss -tln | grep -q ":4173 " || break
            sleep 1
          done
          if ss -tln | grep -q ":4173 "; then
            echo "ERROR: port 4173 still in use after kill + 10s wait"
            exit 1
          fi
      - run: cd panel-ui && npx playwright test --project=chromium --reporter=list
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: nightly-playwright-report
          path: |
            panel-ui/test-results/
            panel-ui/playwright-report/
          retention-days: 7

  audit:
    name: npm audit (advisory)
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Advisory only — a fresh CVE in a transitive dep shouldn't red-X the
      # nightly. Surfaces the report; triage happens off the pipeline.
      - name: npm audit
        continue-on-error: true
        run: cd panel-ui && npm audit --omit=dev || true
