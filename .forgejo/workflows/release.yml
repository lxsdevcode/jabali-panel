# Gitea Actions — release tarball publisher.
#
# Runs on every push to main. Builds the panel-ui SPA + the three Go
# binaries (panel-api, panel-agent, jabali-ssh-shell), bundles them into
# jabali-release-<short_sha>.tar.gz + .sha256, and publishes both as
# assets of a Gitea Release tagged `release-<short_sha>`.
#
# Why a separate workflow (not piggybacking on ci.yml):
#   - Only runs on main; PRs don't waste a build slot publishing
#     releases nobody can consume.
#   - One responsibility — easier to debug failures.
#   - CI gating stays the gate; the release runs after CI is green
#     (needs.ci) so we never publish an artifact for a broken main.
#
# `jabali update` (panel-api/cmd/server/update.go) looks up the release
# by tag using the Gitea API and downloads the .tar.gz + .sha256, so the
# only API surface this workflow needs to maintain is:
#   1. Tag name format:   release-<short_sha>
#   2. Asset names:        jabali-release-<short_sha>.tar.gz[.sha256]
#   3. MANIFEST inside the tarball with short_sha + full_sha + build_time.

name: Release

on:
  push:
    branches: [main]
  # Manual re-trigger for testing the publish path without a main push.
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

# Serialize releases AND supersede stale ones. cancel-in-progress: true so a
# rapid burst of merges to main doesn't each cut a release (which piled up
# behind the release-main group and starved the runner - 2026-07-06). Only the
# LATEST main commit gets a release built; intermediate commits are superseded.
# jabali update only ever wants the newest release/stable, so nothing is lost;
# git keeps the full history regardless. One build at a time -> no API race.
concurrency:
  group: release-main
  cancel-in-progress: true

# Forgejo Actions injects GITHUB_TOKEN read-only by default; creating a
# release + uploading assets needs contents:write.
permissions:
  contents: write

jobs:
  release:
    name: Build + publish release tarball
    runs-on: jabali-ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so build-release.sh can resolve the commit
          # SHA via `git rev-parse` (shallow checkouts ship without
          # parents which messes with rev-parse on tag refs).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel-ui/package-lock.json

      - name: Build release tarball
        id: build
        run: |
          set -euo pipefail
          tools/build-release.sh
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=release-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      # Use Gitea's REST API directly (no marketplace action dependency).
      # GITHUB_TOKEN here is Gitea's auto-injected actions token; on
      # Gitea it carries write:repository scope by default.
      - name: Publish release
        # Don't let a spurious failure in this step (or a runner cleanup hiccup)
        # paint the whole release red when the tarball + checksum actually landed.
        # The authoritative pass/fail is the strict "Confirm assets" gate below,
        # which fails ONLY if an asset is genuinely missing.
        continue-on-error: true
        env:
          API_BASE: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
          FULL_SHA: ${{ steps.build.outputs.full_sha }}
        run: |
          set -euxo pipefail
          TARBALL="dist/jabali-release-${SHORT_SHA}.tar.gz"
          CHECKSUM="${TARBALL}.sha256"
          BODY="Auto-built release for commit \`${FULL_SHA}\`."

          # Create the release. Gitea returns 201 on success or 409 if
          # the tag already exists (rerun); we tolerate 409 so a manual
          # rerun of this workflow doesn't fail.
          create_resp="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "${API_BASE}/repos/${REPO}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"target_commitish\": \"${FULL_SHA}\",
              \"name\": \"Release ${SHORT_SHA}\",
              \"body\": \"${BODY}\",
              \"draft\": false,
              \"prerelease\": false
            }")"
          status="$(echo "$create_resp" | grep '^HTTP_STATUS:' | cut -d: -f2)"
          body="$(echo "$create_resp" | sed '/^HTTP_STATUS:/d')"

          if [[ "$status" == "201" ]]; then
            release_id="$(echo "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          elif [[ "$status" == "409" ]]; then
            # Tag exists: look it up.
            release_id="$(curl -sS \
              -H "Authorization: token ${TOKEN}" \
              "${API_BASE}/repos/${REPO}/releases/tags/${TAG}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          else
            echo "release create failed (status=${status}): ${body}"
            exit 1
          fi
          echo "release_id=${release_id}"

          # Upload assets. Tarball + sha256 sidecar. Asset names match
          # what update.go looks for.
          for f in "$TARBALL" "$CHECKSUM"; do
            name="$(basename "$f")"
            echo "==> uploading $name"
            curl -sS --fail \
              -X POST "${API_BASE}/repos/${REPO}/releases/${release_id}/assets?name=${name}" \
              -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f};type=application/octet-stream" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("uploaded id=%s size=%s" % (d.get("id"), d.get("size")))' \
              || {
                # Sometimes assets exist from a prior partial run.
                # Delete + retry once.
                existing_id="$(curl -sS -H "Authorization: token ${TOKEN}" \
                  "${API_BASE}/repos/${REPO}/releases/${release_id}/assets" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d if a['name']=='${name}'), ''))")"
                if [[ -n "$existing_id" ]]; then
                  echo "asset ${name} already present (id=${existing_id}); deleting + retrying"
                  curl -sS -X DELETE -H "Authorization: token ${TOKEN}" \
                    "${API_BASE}/repos/${REPO}/releases/${release_id}/assets/${existing_id}"
                  curl -sS --fail \
                    -X POST "${API_BASE}/repos/${REPO}/releases/${release_id}/assets?name=${name}" \
                    -H "Authorization: token ${TOKEN}" \
                    -F "attachment=@${f};type=application/octet-stream"
                else
                  exit 1
                fi
              }
          done

          # JAB: verify BOTH assets actually landed — a partial/failed upload used
          # to leave an asset-less orphan release (red X, but the tag existed so
          # nobody noticed the bootstrap/update had nothing to fetch). Retry a few
          # times before failing: the assets list can lag a beat behind upload
          # (eventual consistency) and was tripping a false "missing".
          verify_ok=""
          for attempt in 1 2 3 4 5; do
            assets_json="$(curl -sS -H "Authorization: token ${TOKEN}" \
              "${API_BASE}/repos/${REPO}/releases/${release_id}/assets")"
            missing=""
            for name in "jabali-release-${SHORT_SHA}.tar.gz" "jabali-release-${SHORT_SHA}.tar.gz.sha256"; do
              echo "$assets_json" | python3 -c "import json,sys,os; n=os.environ['N']; d=json.load(sys.stdin); sys.exit(0 if any(a.get('name')==n for a in d) else 1)" N="$name" \
                || missing="$name"
            done
            if [[ -z "$missing" ]]; then verify_ok=1; break; fi
            echo "verify attempt ${attempt}: ${missing} not visible yet, retrying"
            sleep 3
          done
          [[ -n "$verify_ok" ]] || { echo "ASSET MISSING after upload (both retries exhausted)"; exit 1; }
          echo "==> release ${TAG} published with both assets"

          # JAB: prune old release ASSETS so the codeberg storage quota can't fill
          # up and start 413-ing new uploads (which silently broke every release +
          # the bootstrap). Keep the newest KEEP releases' tarballs; strip assets
          # from everything older. Release records (tags) stay; only the heavy
          # .tar.gz/.sha256 are removed — jabali update falls back to source-build
          # for those old commits, which nobody targets anyway.
          #
          # Best-effort ONLY: by this point the release is published + verified, so a
          # prune hiccup (a DELETE 404 on an already-gone asset, a SIGPIPE'd python,
          # a transient API blip) must NOT fail the job and paint the release red.
          # Drop set -e for the cleanup and always exit 0.
          set +e
          KEEP=6
          echo "==> pruning release assets older than the newest ${KEEP}"
          prune_targets="$(curl -sS -H "Authorization: token ${TOKEN}" \
            "${API_BASE}/repos/${REPO}/releases?limit=50" \
            | KEEP="$KEEP" python3 -c 'import json,sys,os; r=json.load(sys.stdin); k=int(os.environ["KEEP"]); print("\n".join("%s %s"%(rel["id"],a["id"]) for rel in r[k:] for a in rel.get("assets",[])))')"
          pruned=0
          while read -r rid aid; do
            [[ -n "$aid" ]] || continue
            curl -sS -o /dev/null -X DELETE -H "Authorization: token ${TOKEN}" \
              "${API_BASE}/repos/${REPO}/releases/${rid}/assets/${aid}" && pruned=$((pruned+1))
          done <<< "$prune_targets"
          echo "  pruned ${pruned} old release assets"
          exit 0

      # Authoritative job result: the release is GOOD iff both assets are fetchable
      # for this commit's tag. Runs even if Publish reported failure (it's
      # continue-on-error) so a spurious step/cleanup red can't mask a real problem
      # — and can't invent one either.
      - name: Confirm assets published
        if: always()
        env:
          API_BASE: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          assets_json="$(curl -sS -H "Authorization: token ${TOKEN}" \
            "${API_BASE}/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a["name"] for a in d.get("assets",[])))')"
          echo "assets for ${TAG}:"; echo "${assets_json}"
          for name in "jabali-release-${SHORT_SHA}.tar.gz" "jabali-release-${SHORT_SHA}.tar.gz.sha256"; do
            echo "${assets_json}" | grep -qx "${name}" || { echo "MISSING asset: ${name}"; exit 1; }
          done
          echo "==> both assets confirmed for ${TAG}"
