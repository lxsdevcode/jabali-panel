# Jabali Panel — Nginx configuration (container)
# Panel is served by FrankenPHP on port 2223
# Nginx handles: mail autoconfig, ACME challenge proxy, and path redirects

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Mail autoconfig endpoints — proxy to Stalwart
    location = /mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/(autodiscover|Autodiscover)(/.*)?$ {
        proxy_pass http://127.0.0.1:8080;
    }

    # ACME challenge — proxy to FrankenPHP/Caddy for certificate issuance
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:2280;
    }

    # Health check endpoint — proxy to FrankenPHP
    location = /up {
        proxy_pass https://127.0.0.1:2223;
        proxy_ssl_verify off;
    }

    # Redirect everything else to panel on port 2223
    location / {
        return 301 https://$host:2223$request_uri;
    }
}

# HTTPS — redirect panel paths to FrankenPHP on port 2223
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    ssl_certificate /etc/ssl/jabali/panel.crt;
    ssl_certificate_key /etc/ssl/jabali/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Redirect all traffic to FrankenPHP panel
    location / {
        return 301 https://$host:2223$request_uri;
    }
}
