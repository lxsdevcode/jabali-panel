[PHP]
max_execution_time = 600
max_input_time = 600
memory_limit = 128M
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 50
date.timezone = UTC

[opcache]
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
