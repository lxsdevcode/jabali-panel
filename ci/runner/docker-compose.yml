# Jabali CI runner — self-hosted Forgejo Actions runner for Codeberg.
#
# Usage (on the runner VPS/host):
#   1. Create a repo-level registration token: Codeberg → repo Settings →
#      Actions → Runners → Create new Runner → copy the token.
#   2. Put it in a root-only .env next to this file (NEVER commit it):
#        echo 'FORGEJO_RUNNER_REGISTRATION_TOKEN=<token>' > .env && chmod 600 .env
#   3. docker compose up -d --build
#
# Persistent volumes keep the runner registration + the dependency caches
# (Go modules, npm, Playwright browser) across container restarts/rebuilds,
# so repeat CI runs are fast. Registration only happens once (entrypoint is
# idempotent on the runner-state volume).
services:
  runner:
    build: .
    image: jabali-ci-runner:latest
    restart: unless-stopped
    # 8 GiB / ≥2 CPU recommended: the vite build OOMs under 4 GiB and the
    # Playwright E2E + go-race are the heavy jobs. mem_limit is applied live
    # on cgroup v2 hosts via `docker update --memory` without a recreate.
    mem_limit: 8g
    environment:
      FORGEJO_INSTANCE_URL: https://codeberg.org
      FORGEJO_RUNNER_NAME: jabali-ci-runner
      FORGEJO_RUNNER_LABELS: "jabali-ci:host"
      RUNNER_TOOL_CACHE: /home/ci/toolcache
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN:-}
    volumes:
      - runner-state:/home/ci/runner        # .runner + config.yml (register once)
      - toolcache:/home/ci/toolcache        # setup-* actions tool cache (Go/Node)
      - go-mod:/home/ci/go/pkg/mod          # Go module cache
      - go-build:/home/ci/.cache/go-build   # Go build cache
      - npm-cache:/home/ci/.npm             # npm cache
      - playwright:/home/ci/.cache/ms-playwright  # Chromium browser cache

volumes:
  runner-state:
  toolcache:
  go-mod:
  go-build:
  npm-cache:
  playwright:
