slug: romm
name: RomM
tags: ["Games", "Media", "Library"]
version: "5.1.0"
description: |
  Self-hosted ROM manager and player with IGDB/MobyGames metadata.
  App container (bundled Redis) + MariaDB. Mount your ROM library
  into the 'library' volume after install.
icon: icon.svg
upstream: https://github.com/rommapp/romm
documentation: https://docs.romm.app/

image_channel: rommapp/romm:5@sha256:ce9d86ab531e09fede45d00f426e3bf2d1f5dd14846f94d6360d77a92a413028
update_mode: manual

resources:
  cpu: "1.5"
  memory: "1g"
  pids: 400

volumes:
  - name: resources
    container_path: /romm/resources
  - name: assets
    container_path: /romm/assets
  - name: config
    container_path: /romm/config
  - name: redis-data
    container_path: /redis-data
  - name: library
    container_path: /romm/library
  - name: db
    container_path: /var/lib/mysql

ports:
  - name: http
    container_port: 8080
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /

env:
  - name: DB_PASSWD
    secret: true
    generate: password32
  - name: MYSQL_ROOT_PASSWORD
    secret: true
    generate: password32
  - name: ROMM_AUTH_SECRET_KEY
    secret: true
    generate: password64
