slug: jabali-sounder
popularity: 38
name: Jabali Sounder
tags: ["Monitoring"]
version: "0.5.25"
description: |
  Control plane for managing multiple Jabali Panel servers from one
  place: enroll panels, monitor their health, and run remediation.
  Single container, SQLite by default. Serves plain HTTP behind the
  panel's reverse proxy. Set JABALI_SOUNDER_ADMIN_PASSWORD in the app's
  environment on first run to create the admin login.
icon: icon.svg
upstream: https://github.com/shukiv/jabali-sounder
documentation: https://github.com/shukiv/jabali-sounder/blob/main/docs/DOCKER.md

image_channel: ghcr.io/shukiv/jabali-sounder:0.5.25@sha256:790d985b8bf552e070689534b38e453421f015007d50a1cf946018ef9eb177e6
volume_owner: "10001:10001"
update_mode: manual

resources:
  cpu: "0.5"
  memory: "256m"
  pids: 200

volumes:
  - name: data
    container_path: /data

ports:
  - name: http
    container_port: 8484
    protocol: tcp
    default_enabled: true
    default_bind: loopback
    default_reverse_proxy: true
    health_path: /health
