# api.jabalihosted.com — TLS termination for the hostname service.
# The service trusts X-Real-IP ONLY from loopback (hostedsvc/realip.go);
# proxy_set_header X-Real-IP below is the single trusted hop. NEVER put a
# CDN in front of this vhost — the claim endpoint derives labels from the
# observed client address.
server {
    listen 80;
    server_name api.jabalihosted.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.jabalihosted.com;

    ssl_certificate     /etc/letsencrypt/live/api.jabalihosted.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jabalihosted.com/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}
